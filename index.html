<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosthodontics Quiz - Complete Denture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.woff2" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.woff2" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.woff2" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateX(4px);
            background-color: #eff6ff;
            border-color: #3b82f6;
        }
        .correct-answer {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }
        .wrong-answer {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }
        .question-text {
            white-space: pre-line;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden fade-in relative">
        
        <!-- Header / Progress Bar -->
        <div class="bg-gradient-to-r from-blue-600 to-blue-700 p-5 text-white flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold">Prosthodontics Quiz</h1>
            <div class="flex items-center gap-2">
                <span id="question-counter" class="text-sm font-semibold bg-white/20 backdrop-blur px-3 py-1 rounded-full">1 / 32</span>
            </div>
        </div>

        <!-- Quiz Content -->
        <div id="quiz-container" class="p-6 md:p-8">
            <!-- Question Text -->
            <h2 id="question-text" class="question-text text-lg md:text-xl font-bold text-gray-800 mb-6 leading-relaxed">
                Loading question...
            </h2>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
                <!-- Options will be injected here via JS -->
            </div>

            <!-- Feedback Section (Hidden by default) -->
            <div id="feedback-section" class="hidden mb-6 p-4 rounded-lg border-l-4 bg-gray-50">
                <div class="flex items-start gap-3">
                    <div id="feedback-icon" class="text-2xl mt-1"></div>
                    <div>
                        <h3 id="feedback-title" class="font-bold text-lg mb-1"></h3>
                        <p id="feedback-reason" class="text-gray-600 text-sm md:text-base leading-relaxed"></p>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex justify-end pt-4 border-t border-gray-100">
                <button id="next-btn" onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Next &rarr;
                </button>
            </div>
        </div>

        <!-- Results Screen (Hidden by default) -->
        <div id="results-container" class="hidden p-8 text-center fade-in">
            <div class="mb-6">
                <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Quiz Completed!</h2>
                <p class="text-gray-500">Here is your summary</p>
            </div>

            <div class="bg-gray-50 rounded-xl p-6 mb-8 max-w-md mx-auto border border-gray-200">
                <div class="flex justify-between items-center mb-4 border-b pb-4">
                    <span class="text-gray-600">Final Score</span>
                    <span id="final-score" class="text-2xl font-bold text-blue-600">0 / 32</span>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-600">Percentage</span>
                    <span id="final-percentage" class="text-xl font-bold text-green-600">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progress-bar-fill" class="bg-blue-600 h-2.5 rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
                <div id="performance-label" class="mt-4 text-sm font-semibold text-gray-700"></div>
            </div>

            <button onclick="location.reload()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-8 rounded-lg shadow-md transition-colors">
                Restart Quiz
            </button>
        </div>

    </div>

    <script>
        // Data Source (32 Questions)
        const questionsData = [
            {
                q: "In history taking for complete denture patients; increasing age:",
                options: [
                    "Increases the readiness to form new habits.",
                    "Decreases the ability to form new habits.",
                    "Has no effects on developing new habits.",
                    "None of the above."
                ],
                correct: "Decreases the ability to form new habits.",
                reason: "Learning ability and neuromuscular coordination naturally diminish with advancing age. Consequently, elderly patients require more time and patience to adapt to new dentures and acquire the necessary muscle control compared to younger individuals."
            },
            {
                q: "With most professional men whose occupation entails intimate contact with their fellows:",
                options: [
                    "Appearance and retention of the denture are more important than efficiency.",
                    "Efficiency of the denture is more important than appearance and retention.",
                    "Efficiency, appearance, and retention of the denture are important.",
                    "Only the appearance is important."
                ],
                correct: "Appearance and retention of the denture are more important than efficiency.",
                reason: "Individuals whose professions involve constant face-to-face social or public interaction prioritize natural aesthetics and secure retention during speech to avoid social embarrassment over achieving maximum masticatory efficiency."
            },
            {
                q: "Public speakers and singers require ............... for the complete denture:",
                options: [
                    "Perfect retention only.",
                    "Perfect retention and particular attention to palatal shape and thickness.",
                    "Perfect appearance only.",
                    "None of the above."
                ],
                correct: "Perfect retention and particular attention to palatal shape and thickness.",
                reason: "Public speakers and singers need exceptional retention to keep the denture stable during wide jaw movements. Additionally, the contour and thickness of the palatal portion directly govern tongue space, articulation, and phonetics."
            },
            {
                q: "Regarding the mental attitude of patients to denture (House Classification), the best patient is:",
                options: [
                    "Philosophical patient.",
                    "Exacting patient.",
                    "Indifferent patient.",
                    "Hysterical patient.",
                    "Skeptical patient."
                ],
                correct: "Philosophical patient.",
                reason: "According to House's classification, the philosophical patient is rational, cooperative, has realistic expectations regarding the limitations of prostheses, and trusts the dentist's judgment—resulting in the most favorable prognosis."
            },
            {
                q: "Adaptation to new dentures is affected by:\n1. Length of time wearing dentures\n2. Amount of residual ridge remaining\n3. Degree of changes made in new dentures\n4. Individual variation",
                options: [
                    "1, 2, 3 & 4",
                    "1, 2 & 3",
                    "1, 2 & 4",
                    "1, 3 & 4"
                ],
                correct: "1, 2, 3 & 4",
                reason: "All four factors collectively influence patient adaptation: prior denture-wearing experience develops neuromuscular skills, residual ridge height provides physical support, drastic changes from an old prosthesis require re-learning, and innate physiological adaptability varies among individuals."
            },
            {
                q: "Adaptation to chewing by new denture may be improved by:\n1. Initially eating soft foods\n2. Initially eating hard foods\n3. Cutting food into smaller pieces\n4. Placing food towards the corners of the mouth",
                options: [
                    "1, 2, 3 & 4",
                    "1, 2 & 3",
                    "1, 2 & 4",
                    "1, 3 & 4"
                ],
                correct: "1, 3 & 4",
                reason: "New denture wearers should start with soft foods, cut food into small pieces, and chew bilaterally near the corners of the mouth (premolar/canine region) to prevent tipping. Hard foods (Statement 2) must be avoided initially as they dislodge the denture and traumatize the mucosa."
            },
            {
                q: "If the patient's own past experience of the old complete dentures was troublesome, the attitude expected with the new dentures is:",
                options: [
                    "Better results",
                    "Pessimism that nothing better can be hoped for",
                    "Excellent result with the new dentures",
                    "a & b",
                    "b & c"
                ],
                correct: "Pessimism that nothing better can be hoped for",
                reason: "A patient who experienced chronic pain, instability, or failure with previous dentures often enters treatment with a pessimistic mindset, doubting that any new prosthesis can succeed, which requires careful psychological preparation."
            },
            {
                q: "The form of the labial surface of the maxillary anterior teeth should harmonize with:",
                options: [
                    "Contour of the facial profile.",
                    "Shape of the frontal surface of patient's face.",
                    "Contour of the forehead.",
                    "Contour of the chin.",
                    "Shape of the mandibular arch."
                ],
                correct: "Shape of the frontal surface of patient's face.",
                reason: "During the extraoral frontal examination, the outline of the patient's face is classified as ovoid, tapering (triangular), or square. The labial form of the maxillary central incisors should mirror this frontal facial shape to achieve natural aesthetic harmony."
            },
            {
                q: "To reduce the depth of the nasolabial sulcus, the complete denture should have:",
                options: [
                    "Low vertical dimension of occlusion.",
                    "Proper vertical dimension of occlusion, tooth position, and thickness of flange.",
                    "Thin denture flanges.",
                    "Lingually placed artificial teeth.",
                    "Porcelain teeth."
                ],
                correct: "Proper vertical dimension of occlusion, tooth position, and thickness of flange.",
                reason: "Loss of teeth and alveolar bone resorption cause the upper lip to collapse, deepening the nasolabial sulcus. Restoring natural facial support requires a combination of accurate vertical dimension of occlusion (VDO), proper anteroposterior tooth positioning, and adequate labial flange thickness."
            },
            {
                q: "The curvature of the mentolabial sulcus demonstrates:",
                options: [
                    "Thickness of labial flange.",
                    "Length of labial flange.",
                    "Three classes of jaw relationship.",
                    "Tooth position.",
                    "Tooth length."
                ],
                correct: "Three classes of jaw relationship.",
                reason: "The contour of the mentolabial sulcus (below the lower lip) reflects the skeletal jaw relationship: it forms an obtuse angle in Class I, a sharp/acute angle in Class II, and appears flattened in Class III."
            },
            {
                q: "Modiolus is located at:",
                options: [
                    "The meeting point of buccinators and other facial muscles.",
                    "The upper lip.",
                    "The lower lip.",
                    "The chin.",
                    "Vermilion border."
                ],
                correct: "The meeting point of buccinators and other facial muscles.",
                reason: "The modiolus is a dense, decussating muscular node located just lateral to the corner of the mouth where the buccinator, orbicularis oris, and several other facial expression muscles converge and decussate."
            },
            {
                q: "Angular cheilitis is caused by:",
                options: [
                    "Ill-fitting denture.",
                    "High vertical dimension.",
                    "Low vertical dimension for a long period.",
                    "High vertical dimension for a long period.",
                    "Setting the teeth outside the ridge."
                ],
                correct: "Low vertical dimension for a long period.",
                reason: "A chronically reduced vertical dimension causes overclosure of the jaws and drooping of the oral commissures. This creates deep skin folds that remain constantly moist with saliva, leading to maceration and secondary fungal infection (Candida albicans)."
            },
            {
                q: "More maxillary anterior teeth are shown if the patient has:",
                options: [
                    "Long lip.",
                    "Thick lip.",
                    "Long and thick lip.",
                    "Short and thin lip.",
                    "Long lip with low mobility."
                ],
                correct: "Short and thin lip.",
                reason: "A short, thin upper lip provides less vertical coverage and drapes higher over the alveolar ridge, naturally exposing a greater portion of the maxillary anterior teeth at rest and during smiling."
            },
            {
                q: "Less maxillary anterior teeth are shown if the patient has:",
                options: [
                    "Thick lip.",
                    "Long and thick lip.",
                    "Short and thin lip.",
                    "Long lip with low mobility."
                ],
                correct: "Long and thick lip.",
                reason: "A long, thick upper lip drapes lower over the maxillary arch and has greater bulk, concealing more of the maxillary anterior teeth during rest and speech."
            },
            {
                q: "In an old denture wearer, wrinkles around the modiolus, low visibility of vermilion border, and turned-in lip indicate:",
                options: [
                    "Vitamin B deficiency.",
                    "High vertical dimension of occlusion.",
                    "Low vertical dimension of occlusion.",
                    "Viral infection.",
                    "Neoplasia."
                ],
                correct: "Low vertical dimension of occlusion.",
                reason: "Wrinkling at the corners of the mouth, thinning/disappearance of the vermilion border, and inward rolling of the lips are classic clinical signs of facial collapse resulting from a decreased vertical dimension of occlusion (due to ridge resorption and occlusal wear)."
            },
            {
                q: "Which of the following is NOT a type of mandibular ridge?",
                options: [
                    "Broad and well-developed ridge.",
                    "Ridge exhibiting undercut areas.",
                    "Knife-like ridge.",
                    "Thick bulky ridge with high vault palate.",
                    "Flat ridge."
                ],
                correct: "Thick bulky ridge with high vault palate.",
                reason: "A \"high vault palate\" is an anatomical feature exclusive to the maxillary arch (hard palate), whereas the mandibular arch is occupied by the tongue and floor of the mouth."
            },
            {
                q: "The ideal mucosa for a complete denture is to be:",
                options: [
                    "Loosely bound down to the sub-adjacent bone.",
                    "Flabby.",
                    "Of uneven thickness.",
                    "Firmly bound to the submucosa, slightly compressible, and of an even thickness.",
                    "Without submucosa."
                ],
                correct: "Firmly bound to the submucosa, slightly compressible, and of an even thickness.",
                reason: "Firm attachment prevents shifting of the denture base, slight compressibility acts as a cushion to absorb masticatory forces, and uniform thickness ensures even stress distribution across the residual ridge without creating localized pressure points."
            },
            {
                q: "Redness and ulceration in labial sulcus may be due to:",
                options: [
                    "Under extension of denture flange.",
                    "Low vertical dimension of occlusion.",
                    "Over extension of denture flange.",
                    "Bone speckles at ridge crest.",
                    "Rough fitting surface."
                ],
                correct: "Over extension of denture flange.",
                reason: "When a denture flange extends beyond the functional depth of the vestibular reflection, it impinges upon and traumatizes the movable soft tissues of the sulcus, causing localized erythema and ulceration."
            },
            {
                q: "Denture stomatitis is caused by:",
                options: [
                    "Vitamin B deficiency.",
                    "Removing the denture at night.",
                    "Dirty ill-fitting denture, continuous wearing of denture, and sometimes Candida albicans infection.",
                    "Viral infection.",
                    "Neoplasm."
                ],
                correct: "Dirty ill-fitting denture, continuous wearing of denture, and sometimes Candida albicans infection.",
                reason: "Denture stomatitis is a chronic inflammatory condition of the denture-bearing mucosa driven by poor denture hygiene (plaque accumulation), mechanical trauma from an ill-fitting prosthesis, lack of tissue rest (wearing the denture 24/7), and opportunistic Candida albicans colonization."
            },
            {
                q: "Tissue conditioner is used for the treatment of:",
                options: [
                    "Neoplasm.",
                    "Torus palatinus.",
                    "Torus mandibularis.",
                    "Denture stomatitis.",
                    "Angular cheilitis."
                ],
                correct: "Denture stomatitis.",
                reason: "Tissue conditioners are soft, resilient temporary lining materials placed inside an existing denture to cushion traumatized tissues, distribute occlusal loads evenly, and allow abused, inflamed mucosa to recover its healthy anatomical form before making a final impression."
            },
            {
                q: "The most common site of mandibular torus is:",
                options: [
                    "Palatal side of posterior maxilla.",
                    "Buccal side of posterior maxilla.",
                    "Buccal side of posterior mandible.",
                    "Labial side of anterior mandible.",
                    "Lingual side opposite to mandibular premolars."
                ],
                correct: "Lingual side opposite to mandibular premolars.",
                reason: "Torus mandibularis typically presents as bilateral, benign bony exostoses on the lingual aspect of the mandible above the mylohyoid line in the premolar region."
            },
            {
                q: "The most common site of torus palatinus is:",
                options: [
                    "Anterior to the incisive papilla.",
                    "Midline of hard palate or on each side of median palatine raphe posterior to the incisive papilla.",
                    "Buccal side of posterior maxilla.",
                    "Buccal side of posterior mandible.",
                    "Labial side of anterior mandible."
                ],
                correct: "Midline of hard palate or on each side of median palatine raphe posterior to the incisive papilla.",
                reason: "Torus palatinus is a benign bony growth located along the midline of the hard palate (median palatine raphe) posterior to the incisive papilla. Because it is covered by thin, unyielding mucosa, it requires relief or surgical removal to prevent denture rocking."
            },
            {
                q: "The largest width of the posterior palatal seal occurs in soft palate curvature having:",
                options: [
                    "Class I.",
                    "Class II.",
                    "Class III.",
                    "Class IV.",
                    "Class V."
                ],
                correct: "Class I.",
                reason: "In a Class I soft palate (House's classification), the soft palate extends almost horizontally from the hard palate with minimal downward slope. This creates a broad, wide vibrating zone that accommodates the widest and most effective posterior palatal seal."
            },
            {
                q: "Many complete denture troubles can be traced to the fact that no preparation of the patient's mind preceded the fitting of the dentures.",
                options: [
                    "True",
                    "False"
                ],
                correct: "True",
                reason: "Educating the patient beforehand about the mechanical and physiological limitations of complete dentures prevents unrealistic expectations. When patients are mentally prepared, initial difficulties are accepted as normal hurdles rather than perceived as failures of the prosthesis."
            },
            {
                q: "During management of a completely edentulous patient, you should follow this statement: \"Meet the mouth of the patient before meeting the mind of the patient.\"",
                options: [
                    "True",
                    "False"
                ],
                correct: "False",
                reason: "The correct clinical principle is the exact opposite: \"Meet the mind of the patient before meeting the mouth of the patient.\" Understanding the patient's psychology, expectations, and concerns must precede clinical intervention."
            },
            {
                q: "Initial speaking problems with new denture are usually transitory.",
                options: [
                    "True",
                    "False"
                ],
                correct: "True",
                reason: "Temporary speech alterations occur initially because the tongue must adapt to new palatal contours and tooth positions. With normal neuromuscular adaptation and reading aloud, speech typically returns to normal within a few days to weeks."
            },
            {
                q: "Denture life expectancy is one year.",
                options: [
                    "True",
                    "False"
                ],
                correct: "False",
                reason: "Complete dentures have a functional lifespan of approximately 5 to 7 years (not one year), although periodic recall visits and relining are necessary to compensate for ongoing residual ridge resorption."
            },
            {
                q: "If the patient has worn partial dentures with comfort and efficiency prior to being rendered edentulous, the same will be expected of complete dentures.",
                options: [
                    "True",
                    "False"
                ],
                correct: "True",
                reason: "A positive, successful prior experience with removable partial dentures indicates good neuromuscular coordination and fosters realistic optimism, leading the patient to expect comparable comfort and function from their complete dentures."
            },
            {
                q: "Patients with minimal ridges should be advised that their dentures will likely move (especially the mandibular) and their efficiency will therefore be reduced.",
                options: [
                    "True",
                    "False"
                ],
                correct: "True",
                reason: "Severely resorbed ridges provide poor retention and stability, particularly in the mandible. Informing the patient prior to treatment serves as a factual explanation of anatomical limitations rather than an excuse after delivery."
            },
            {
                q: "One of the instructions to the new denture wearer is: dentures are less efficient than natural teeth.",
                options: [
                    "True",
                    "False"
                ],
                correct: "True",
                reason: "Complete dentures rely on mucosal support rather than periodontal ligaments and provide only about 20–25% of natural biting force. Patients must be informed of this biological reality before treatment begins."
            },
            {
                q: "It is an exception that a new denture wearer can eat all foods easily.",
                options: [
                    "True",
                    "False"
                ],
                correct: "True",
                reason: "Because complete dentures have reduced masticatory efficiency and stability compared to natural dentition, patients who can effortlessly eat any type of food represent the exception rather than the rule."
            },
            {
                q: "Allergy to acrylic denture is a very rare condition. Most of the cases are due to dirty, ill-fitting dentures.",
                options: [
                    "True",
                    "False"
                ],
                correct: "True",
                reason: "True hypersensitivity to properly cured polymethyl methacrylate (PMMA) is exceedingly rare. The vast majority of mucosal inflammation beneath dentures is caused by microbial plaque (poor hygiene), fungal infection, or mechanical trauma from an ill-fitting base."
            }
        ];

        // State Management
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];
        let answered = false;

        // DOM Elements
        const quizContainer = document.getElementById('quiz-container');
        const resultsContainer = document.getElementById('results-container');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackSection = document.getElementById('feedback-section');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackReason = document.getElementById('feedback-reason');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const counterEl = document.getElementById('question-counter');

        // Utility: Shuffle Array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Initialize Quiz
        function initQuiz() {
            shuffledQuestions = [...questionsData];
            loadQuestion();
        }

        // Load Question
        function loadQuestion() {
            answered = false;
            const currentQ = shuffledQuestions[currentQuestionIndex];
            
            // Update UI
            counterEl.textContent = `${currentQuestionIndex + 1} / ${shuffledQuestions.length}`;
            questionText.textContent = currentQ.q;
            
            // Reset Feedback
            feedbackSection.classList.add('hidden');
            nextBtn.disabled = true;
            nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
            nextBtn.textContent = currentQuestionIndex === shuffledQuestions.length - 1 ? "Finish Quiz" : "Next →";

            // Prepare Options
            let optionsObj = currentQ.options.map(opt => ({ text: opt, isCorrect: opt === currentQ.correct }));
            shuffleArray(optionsObj);

            // Render Options
            optionsContainer.innerHTML = '';
            optionsObj.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 rounded-lg border-2 border-gray-200 bg-white text-gray-700 font-medium text-base hover:border-blue-300 focus:outline-none";
                btn.textContent = opt.text;
                btn.onclick = () => checkAnswer(btn, opt.isCorrect, currentQ.reason);
                optionsContainer.appendChild(btn);
            });
        }

        // Check Answer
        function checkAnswer(selectedBtn, isCorrect, reason) {
            if (answered) return;
            answered = true;

            const buttons = optionsContainer.querySelectorAll('button');
            const correctText = shuffledQuestions[currentQuestionIndex].correct;
            
            // Highlight selected and correct answers
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn === selectedBtn) {
                    if (isCorrect) {
                        btn.classList.add('correct-answer');
                        score++;
                    } else {
                        btn.classList.add('wrong-answer');
                    }
                }
                // Always highlight the correct answer
                if (btn.textContent === correctText && btn !== selectedBtn) {
                    btn.classList.add('correct-answer');
                }
            });

            // Show Feedback
            feedbackSection.classList.remove('hidden');
            feedbackSection.classList.add('fade-in');
            
            if (isCorrect) {
                feedbackTitle.textContent = "Correct!";
                feedbackTitle.className = "font-bold text-lg mb-1 text-green-700";
                feedbackSection.className = "mb-6 p-4 rounded-lg border-l-4 bg-green-50 border-green-500 fade-in";
                feedbackIcon.textContent = "✅";
            } else {
                feedbackTitle.textContent = "Incorrect";
                feedbackTitle.className = "font-bold text-lg mb-1 text-red-700";
                feedbackSection.className = "mb-6 p-4 rounded-lg border-l-4 bg-red-50 border-red-500 fade-in";
                feedbackIcon.textContent = "❌";
            }
            
            feedbackReason.textContent = reason;

            // Enable Next Button
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // Next Question
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Show Results
        function showResults() {
            quizContainer.classList.add('hidden');
            resultsContainer.classList.remove('hidden');
            
            const total = shuffledQuestions.length;
            const percentage = Math.round((score / total) * 100);
            
            document.getElementById('final-score').textContent = `${score} / ${total}`;
            document.getElementById('final-percentage').textContent = `${percentage}%`;
            
            // Animate progress bar
            setTimeout(() => {
                document.getElementById('progress-bar-fill').style.width = `${percentage}%`;
            }, 100);
            
            // Color code the percentage
            const percEl = document.getElementById('final-percentage');
            const labelEl = document.getElementById('performance-label');
            
            if (percentage >= 90) {
                percEl.className = "text-xl font-bold text-green-600";
                labelEl.textContent = "🏆 Outstanding Performance!";
                labelEl.className = "mt-4 text-sm font-semibold text-green-700";
            } else if (percentage >= 75) {
                percEl.className = "text-xl font-bold text-blue-600";
                labelEl.textContent = "👏 Great Job!";
                labelEl.className = "mt-4 text-sm font-semibold text-blue-700";
            } else if (percentage >= 50) {
                percEl.className = "text-xl font-bold text-yellow-600";
                labelEl.textContent = "📚 Good Effort - Keep Studying!";
                labelEl.className = "mt-4 text-sm font-semibold text-yellow-700";
            } else {
                percEl.className = "text-xl font-bold text-red-600";
                labelEl.textContent = "💪 Needs More Review";
                labelEl.className = "mt-4 text-sm font-semibold text-red-700";
            }
        }

        // Start
        initQuiz();

    </script>
